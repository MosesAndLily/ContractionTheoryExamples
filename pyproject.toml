[project]
name = "contraction-theory-examples"
version = "0.1.0"
description = "Animated examples for contraction theory and geometric mechanics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
pendulum-cylinder = "contraction_examples.pendulum_cylinder.animate:main"
pendulum-lagrangian = "contraction_examples.pendulum_cylinder.lagrangian:main"
double-pendulum-torus = "contraction_examples.double_pendulum_torus.animate:main"
torus-linear-flow = "contraction_examples.double_pendulum_torus.linear_flow:main"
mass-spring-damper = "contraction_examples.mass_spring_damper.animate:main"
pendulum-contraction = "contraction_examples.pendulum_contraction.animate:main"
double-pendulum-contraction = "contraction_examples.double_pendulum_contraction.animate:main"
converse-contraction = "contraction_examples.double_pendulum_contraction.converse:main"
spectral-radius-abscissa = "contraction_examples.spectral_radius_abscissa.plot:main"
norm-spectrum = "contraction_examples.spectral_radius_abscissa.norms:main"
induced-log-norms = "contraction_examples.induced_log_norms.plot:main"
hopfield-norms = "contraction_examples.hopfield_norms.plot:main"
firing-rate-portrait = "contraction_examples.firing_rate.plot:main"
firing-rate-bias = "contraction_examples.firing_rate.bias:main"
parallel-combination = "contraction_examples.parallel_combination.plot:main"
feedback-interconnection = "contraction_examples.interconnection.plot:main"
parallel-combination-phases = "contraction_examples.parallel_combination.phases:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contraction_examples"]
